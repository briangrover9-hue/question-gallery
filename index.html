<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<meta charset="utf-8">
<title>Question Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Anton&family=Pacifico&family=Bungee&family=Abril+Fatface&family=Righteous&family=Chango&display=swap" rel="stylesheet">
<style>
/* One idea: a small yellow computer alone on a pale desk. You can pick it up and throw it, it leans toward your mouse, and a click pushes the camera in until its screen is the page. Inside, a floppy disk loads your category, and a gallery of WordArt tiles opens the questions Harmonya answers for it. The wallpaper is alive, the windows drag and stack, and each question ends in a way to ask us to run it. */
:root{
  --ground:#f5f8ff; --ink:#1b1d22; --ink-dim:#5b6070;
  --yellow-a:#ffdd57; --yellow-b:#f3b81b; --yellow-c:#c98f00;
  --os:#071821;
  --face:#c3c3c3; --hi:#ffffff; --mid:#848484; --dark:#262626;
  --title-a:#0a246a; --title-b:#3a6ea5;
  --text:#14181b; --muted:#555c62; --paper:#ffffff; --teal:#009ea6; --ok:#2a9d5f; --bad:#b3261e;
  --f-ui:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease-io:cubic-bezier(.66,0,.2,1); --ease-out:cubic-bezier(.23,1,.32,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --u:1cqw;
  --s0:.26;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);transition:background .45s;color:var(--ink);font-family:var(--f-ui);margin:0;overflow:hidden}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;transition:opacity .45s;background:radial-gradient(ellipse 58% 52% at 50% 54%,#ffffff 0%,rgba(255,255,255,0) 72%),radial-gradient(rgba(40,70,140,.13) 1px,rgba(40,70,140,0) 1.4px) 0 0/26px 26px;-webkit-mask-image:radial-gradient(ellipse 80% 74% at 50% 52%,#000 25%,rgba(0,0,0,0) 100%);mask-image:radial-gradient(ellipse 80% 74% at 50% 52%,#000 25%,rgba(0,0,0,0) 100%)}
body.full .stage::before{opacity:0}
body.full{background:var(--os)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.stage{position:fixed;inset:0;overflow:hidden}

/* The computer, drawn at 1180 x 1065 and scaled */
.pc{position:absolute;left:50%;top:50%;width:1180px;height:1065px;margin:-532px 0 0 -590px;transform-origin:50% 50%;transform:perspective(1900px) rotateY(var(--ry,-13deg)) rotateX(var(--rx,3deg)) translate(var(--tx,0px),var(--ty,0px)) scale(var(--sc,var(--s0)));touch-action:none;user-select:none;-webkit-user-select:none}
.pc.zooming{transition:transform 1.1s var(--ease-io)}
.pc:not(.in) .case,.pc:not(.in) .recess,.pc:not(.in) .depth{cursor:grab}
.pc.grabbing,.pc.grabbing *{cursor:grabbing!important}
.shadow{position:absolute;left:4%;bottom:-70px;width:100%;height:110px;background:radial-gradient(ellipse at center,rgba(60,45,0,.30),rgba(60,45,0,0) 68%);filter:blur(12px);transform:scale(calc(1 + var(--lift,0)*.2));opacity:calc(1 - var(--lift,0)*.3)}
.depth{position:absolute;right:-84px;top:70px;width:130px;height:960px;border-radius:0 80px 56px 0;background:linear-gradient(90deg,var(--yellow-b),var(--yellow-c))}
.case{position:absolute;inset:0;border-radius:150px 150px 90px 90px/130px 130px 70px 70px;background:linear-gradient(160deg,#ffe479 0%,var(--yellow-a) 30%,var(--yellow-b) 100%);box-shadow:inset 0 8px 0 rgba(255,255,255,.55),inset 0 -14px 0 rgba(150,100,0,.25),inset 14px 0 30px rgba(255,255,255,.25)}
.recess{position:absolute;left:112px;top:102px;width:956px;height:731px;border-radius:70px/60px;background:linear-gradient(#e8a915,#fbd04a);box-shadow:inset 0 6px 14px rgba(120,80,0,.35),0 3px 0 rgba(255,255,255,.5)}
.screen{container:scr/size;position:absolute;left:140px;top:130px;width:900px;height:675px;overflow:hidden;background:var(--os);font-family:var(--f-ui);border-radius:60px/52px;box-shadow:0 0 0 8px #2a2925,inset 0 0 50px rgba(0,0,0,.45);transition:filter .2s,border-radius .5s,box-shadow .5s}
.pc:not(.in) .screen{cursor:pointer}
.pc:not(.in) .screen:hover{filter:brightness(1.06)}
.pc:not(.in) .screen:focus-visible{outline:5px solid var(--ink);outline-offset:10px}
.screen::after{content:"";position:absolute;inset:0;z-index:50;pointer-events:none;transition:opacity .5s;border-radius:inherit;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.05) 0,rgba(0,0,0,.05) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.26) 100%)}
.glare{position:absolute;inset:0;z-index:49;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.22),rgba(255,255,255,0) 42%);transition:opacity .5s}
.pc.full .glare{opacity:0}
.pc.zooming .screen{animation:warp 1.1s var(--ease-io)}
@keyframes warp{0%{filter:blur(0) brightness(1)}40%{filter:blur(3px) brightness(1.1)}100%{filter:blur(0) brightness(1)}}
.pc .case,.pc .recess,.pc .depth,.pc .slot,.pc .led,.pc .badge{transition:opacity .45s}
.pc.full .case,.pc.full .recess,.pc.full .depth,.pc.full .shadow,.pc.full .slot,.pc.full .led,.pc.full .badge{opacity:0}
.pc.full .screen{border-radius:0;box-shadow:none}
.pc.full .screen::after{opacity:0}
.slot{position:absolute;left:50%;top:905px;width:420px;height:20px;margin-left:-210px;border-radius:10px;background:#7a5800;box-shadow:inset 0 4px 6px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.55)}
.led{position:absolute;left:1000px;top:912px;width:14px;height:14px;border-radius:50%;background:#fff6d0;box-shadow:inset 0 -2px 0 rgba(150,100,0,.4)}
.badge{position:absolute;left:140px;top:893px;font-size:34px;font-weight:600;letter-spacing:.01em;color:rgba(120,80,0,.7);pointer-events:none}
#wall{position:absolute;inset:0;width:100%;height:100%;display:block}
.desk{position:absolute;inset:0}
.clickbtn{position:absolute;left:50%;top:50%;width:230px;height:92px;margin:-46px 0 0 -115px;display:grid;place-items:center;font-size:38px;font-weight:500;color:var(--text);border:0;z-index:48;animation:nudge 2.6s var(--ease-out) infinite;transition:opacity .35s}
@media (hover:hover){.pc:not(.in) .screen:hover .clickbtn{background:#3a3a3a;color:#fff}}
.pc:not(.in) .screen:active .clickbtn{transform:scale(.96)}
@keyframes nudge{0%,70%,100%{transform:none}78%{transform:scale(.95)}88%{transform:none}}
.pc.in .clickbtn{opacity:0;pointer-events:none;animation:none}
.pc:not(.in) .w,.pc:not(.in) .icons{pointer-events:none}


/* Win98 chrome copied from the WordArt dialog */
.bevel{background:var(--face);box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--mid),inset 2px 2px 0 #dfdfdf}
.sunk{box-shadow:inset 1px 1px 0 var(--mid),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark)}
.w{position:absolute;left:calc(var(--u)*var(--wl,10));top:calc(var(--u)*var(--wt,8));width:calc(var(--u)*var(--ww,60));height:calc(var(--u)*var(--wh,50));translate:var(--dx,0px) var(--dy,0px);display:flex;flex-direction:column;padding:2px;color:var(--text);box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--mid),inset 2px 2px 0 #dfdfdf,0 14px 44px rgba(0,0,0,.5);transform-origin:var(--ox,50%) var(--oy,50%)}
.w.auto{height:auto}
.w.pop{animation:pop .28s var(--ease-out)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.tt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlebar{--ta:var(--title-a);--tb:var(--title-b);display:flex;align-items:center;justify-content:space-between;gap:8px;height:calc(var(--u)*2.7);flex:none;padding:0 3px 0 7px;background:linear-gradient(90deg,var(--ta),var(--tb));color:#fff;font-weight:600;font-size:calc(var(--u)*1.15);cursor:move;touch-action:none}
.ctl{display:flex;gap:2px}
.ctl button{width:calc(var(--u)*1.9);height:calc(var(--u)*1.7);display:grid;place-items:center;font-size:calc(var(--u)*1);line-height:1;color:var(--text);border:0;padding:0;cursor:pointer}
.ctl button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.pc:not(.in) .ctl button{pointer-events:none}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column}

/* Desktop icons: how you get back to a window you closed */
.icons{position:absolute;left:calc(var(--u)*2);bottom:calc(var(--u)*2.4);display:flex;flex-direction:column;gap:calc(var(--u)*1.6);z-index:3}
.icon{display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.5);width:calc(var(--u)*8);background:transparent;border:0;padding:calc(var(--u)*.5) 0;color:#e8f4f6;font-size:calc(var(--u)*1.05);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.icon svg{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6));transition:transform .18s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.icon:hover svg{transform:translateY(-3px) scale(1.08)}}
.icon:active svg{transform:scale(.95)}
.icon:focus-visible{outline:1px dotted #fff;outline-offset:2px}

/* Load window with the floppy */
.lw{display:grid;grid-template-columns:minmax(0,11fr) minmax(0,8fr);gap:calc(var(--u)*2);padding:calc(var(--u)*2.2) calc(var(--u)*2.4);background:var(--paper);margin:0 calc(var(--u)*.5) calc(var(--u)*.5);flex:1}
.lw-form{display:flex;flex-direction:column;gap:calc(var(--u)*1.1);min-width:0}
.lw-h{margin:0;font-size:calc(var(--u)*2.7);line-height:1.08;font-weight:300;letter-spacing:-.02em}
.lw-sub{margin:0;font-size:calc(var(--u)*1.2);color:var(--muted);line-height:1.45}
.cats{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.55);margin-top:calc(var(--u)*-.2)}
.cat{height:calc(var(--u)*2.4);padding:0 calc(var(--u)*.9);border:0;font-size:calc(var(--u)*1);font-weight:400;color:var(--text);background:var(--face);box-shadow:inset -1px -1px 0 var(--dark),inset 1px 1px 0 var(--hi),inset -2px -2px 0 var(--mid)}
.cat[aria-pressed="true"]{background:#fff3b0;box-shadow:inset 1px 1px 0 var(--dark),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--mid);font-weight:600}
.cat:focus-visible,.loadbtn:focus-visible,.ok:focus-visible{outline:1px dotted var(--text);outline-offset:-5px}
.fld{display:flex;flex-direction:column;gap:calc(var(--u)*.35);font-size:calc(var(--u)*1.05);color:var(--muted)}
.fld input{height:calc(var(--u)*3);padding:0 calc(var(--u)*1);border:0;background:#fff;color:var(--text);font-size:calc(var(--u)*1.25);box-shadow:0 0 0 1px #9a9a9a,inset 1px 1px 0 #3b3b3b;border-radius:0}
.fld input:focus{outline:2px solid var(--teal);outline-offset:1px}
.fine{margin:0;font-size:calc(var(--u)*1);color:var(--muted);line-height:1.4}
.err{margin:0;min-height:1.2em;font-size:calc(var(--u)*1.05);color:var(--bad)}
.loadbtn{align-self:flex-start;min-width:calc(var(--u)*11);height:calc(var(--u)*3.3);border:0;font-size:calc(var(--u)*1.3);font-weight:600;color:var(--text)}
.loadbtn:disabled{color:#7b7b7b;cursor:default}
.loadbtn:active:not(:disabled){transform:scale(.97)}
.lw-disk{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.floppy{width:62%;aspect-ratio:120/124;position:relative;z-index:1;transform:translateY(-4%) rotate(-5deg);transition:transform 1s var(--ease-io)}
.floppy svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.3))}
.lw.loading .floppy{transform:translateY(46%) rotate(0deg)}
.drive{position:relative;z-index:2;width:92%;height:calc(var(--u)*9);margin-top:calc(var(--u)*-1.4);background:linear-gradient(#e7e1cf,#c9c2ae);border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 1px #8d8671;display:flex;align-items:flex-end;justify-content:space-between;padding:0 calc(var(--u)*1.4) calc(var(--u)*1.1)}
.drive::before{content:"";position:absolute;left:8%;right:8%;top:calc(var(--u)*1.6);height:calc(var(--u)*.9);background:#2a2620;border-radius:3px;box-shadow:inset 0 3px 4px rgba(0,0,0,.7)}
.dled{width:calc(var(--u)*.9);height:calc(var(--u)*.9);border-radius:50%;background:#58604f;margin-left:auto}
.lw.loading .dled{animation:dledon .35s steps(2) infinite;background:#7fe08a;box-shadow:0 0 8px #7fe08a}
@keyframes dledon{50%{opacity:.35}}
.prog{width:92%;margin-top:calc(var(--u)*1.4);display:flex;flex-direction:column;gap:calc(var(--u)*.6)}
.prog[hidden]{display:none}
.bar{height:calc(var(--u)*1.7);background:#fff;box-shadow:inset 1px 1px 0 var(--mid),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark);padding:2px}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,#0a246a 0,#0a246a 8px,#fff 8px,#fff 10px);transition:width 1.7s linear}
.ptxt{font-size:calc(var(--u)*1.05);color:var(--muted)}
.lw.loading input,.lw.loading .cat,.lw.loading .loadbtn{pointer-events:none;opacity:.6}

/* Gallery window */
.dlg-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:calc(var(--u)*.7);padding:calc(var(--u)*1.1) calc(var(--u)*1.3) calc(var(--u)*1)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:calc(var(--u)*1.2);flex-wrap:wrap}
.dlg-label{font-size:calc(var(--u)*1.2)}
.filters{display:flex;gap:calc(var(--u)*1.4);align-items:center}
.chip{border:0;background:transparent;padding:2px 0;font-size:calc(var(--u)*1.05);color:var(--muted);border-bottom:1px solid transparent}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{color:var(--text);font-weight:600;border-bottom-color:var(--text)}
.chip:focus-visible{outline:2px solid var(--title-a);outline-offset:2px}
.count{font-size:calc(var(--u)*1.05);color:var(--muted);font-variant-numeric:tabular-nums;min-width:7ch;text-align:right}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);gap:calc(var(--u)*.55);padding:calc(var(--u)*.7);background:#9d9d9d}
.tile{padding:0;border:0;background:var(--paper);display:block;overflow:hidden;box-shadow:inset 1px 1px 0 var(--mid),inset -1px -1px 0 var(--hi),inset 2px 2px 0 var(--dark);transition:opacity .18s,filter .18s}
.tile svg{width:100%;height:100%;display:block;pointer-events:none;transition:transform .16s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.tile:hover:not(:disabled) svg{transform:scale(1.07)}}
.tile:active:not(:disabled) svg{transform:scale(.97)}
.tile:hover:not(:disabled){box-shadow:inset 0 0 0 3px var(--title-a)}
.tile:focus-visible{outline:1px dotted var(--text);outline-offset:-6px}
.tile:disabled{opacity:.2;filter:grayscale(1);cursor:default}
.tile.seen::after{content:"";position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--ok)}
.tile{position:relative}
.status{display:flex;justify-content:space-between;gap:calc(var(--u)*1.2);align-items:center;min-height:calc(var(--u)*2.4);padding:0 calc(var(--u)*.8);font-size:calc(var(--u)*1.1);line-height:1.3;box-shadow:inset 1px 1px 0 var(--mid),inset -1px -1px 0 var(--hi)}
.status span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status span:last-child{flex:none;color:var(--muted)}

/* Question windows: take the color of the tile they came from */
.menubar{display:flex;align-items:center;gap:calc(var(--u)*.3);padding:calc(var(--u)*.35) calc(var(--u)*.5);flex:none}
.menubar button{border:0;background:transparent;padding:calc(var(--u)*.4) calc(var(--u)*.9);font-size:calc(var(--u)*1.05);color:var(--text)}
.menubar button:hover{background:var(--acc,var(--title-a));color:#fff}
.menubar button:focus-visible{outline:2px solid var(--title-a);outline-offset:-2px}
.menubar .pos{margin-left:auto;font-size:calc(var(--u)*1.05);color:var(--muted);font-variant-numeric:tabular-nums;padding-right:calc(var(--u)*.6)}
.dots{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*1.1);padding:calc(var(--u)*.8) calc(var(--u)*2);background:var(--paper);margin:0 calc(var(--u)*.5);flex:none}
.dot{width:calc(var(--u)*1);height:calc(var(--u)*1);border-radius:50%;border:0;padding:0;background:var(--c);opacity:.55;transition:transform .25s var(--spring),opacity .2s}
.dot:hover{opacity:1}
.dot[aria-current="true"]{opacity:1;transform:scale(1.55);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--c)}
.dot:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.canvas{flex:1;min-height:0;overflow:auto;background:var(--paper);margin:0 calc(var(--u)*.5) calc(var(--u)*.5);padding:calc(var(--u)*2.2) calc(var(--u)*2.6);display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);column-gap:calc(var(--u)*2.6);align-content:start;scrollbar-color:var(--mid) var(--face)}
.left{display:flex;flex-direction:column;gap:calc(var(--u)*1.4);min-width:0}
.banner{width:60%;aspect-ratio:160/108;margin-left:calc(var(--u)*-.8)}
.banner svg{width:100%;height:100%;display:block}
.qd{margin:0;font-size:calc(var(--u)*2.5);line-height:1.12;font-weight:300;letter-spacing:-.02em;text-wrap:balance}
.right{display:flex;flex-direction:column;gap:calc(var(--u)*1.3);min-width:0}
.field{padding:calc(var(--u)*1) calc(var(--u)*1.2);background:#fff;box-shadow:0 0 0 1px #9a9a9a,inset 1px 1px 0 #3b3b3b;font-size:calc(var(--u)*1.2);line-height:1.45;min-height:calc(var(--u)*6.4)}
.field .cur::after{content:"";display:inline-block;width:.5ch;height:1.05em;margin-left:2px;vertical-align:text-bottom;background:var(--acc,var(--teal));animation:blink 1s steps(2) infinite}
.field.done .cur::after{display:none}
@keyframes blink{50%{opacity:0}}
.reveal{display:flex;flex-direction:column;gap:calc(var(--u)*1.3)}
.reveal>*{opacity:0;transform:translateY(8px);transition:opacity .45s var(--ease-out),transform .45s var(--ease-out)}
.reveal.on>*{opacity:1;transform:none}
.reveal.on>.ans{transition-delay:1.1s}
.reveal.on>.cta{transition-delay:1.5s}
.ans{margin:0;font-size:calc(var(--u)*1.3);line-height:1.5}
.cta{display:flex;flex-direction:column;gap:calc(var(--u)*.7);padding-top:calc(var(--u)*1);border-top:1px solid #d9d9d9}
.cta p{margin:0;font-size:calc(var(--u)*1.1);color:var(--muted);line-height:1.45}
.cta .go{align-self:flex-start;height:calc(var(--u)*3.2);padding:0 calc(var(--u)*1.8);border:0;font-size:calc(var(--u)*1.25);font-weight:600;color:var(--text)}
.cta .hd{font-size:calc(var(--u)*1.5)!important;font-weight:500;color:var(--text)!important;line-height:1.25}
.cta .go:active{transform:scale(.97)}
.cta .row2{display:flex;gap:calc(var(--u)*.6);align-items:center}
.cta input{flex:1;min-width:0;height:calc(var(--u)*3);padding:0 calc(var(--u)*1);border:0;background:#fff;font-size:calc(var(--u)*1.2);box-shadow:0 0 0 1px #9a9a9a,inset 1px 1px 0 #3b3b3b;border-radius:0}
.cta input:focus{outline:2px solid var(--acc,var(--teal));outline-offset:1px}
.cta .done{color:var(--text);font-weight:500}
.cta .note{font-size:calc(var(--u)*.95);color:var(--muted)}


/* Example visuals: the shape of each answer, drawn in the same retro idiom, never real numbers */
.vz{border-top:2px solid var(--acc,var(--title-a));padding-top:calc(var(--u)*1)}
.vz h4{margin:0 0 calc(var(--u)*.8);font-size:calc(var(--u)*1.15);font-weight:600;line-height:1.3}
.vz .leg{display:flex;gap:calc(var(--u)*1.4);margin:0 0 calc(var(--u)*.8);font-size:calc(var(--u)*.95);color:var(--muted);flex-wrap:wrap}
.vz .leg i{display:inline-block;width:calc(var(--u)*.9);height:calc(var(--u)*.9);margin-right:5px;vertical-align:-1px}
.vz .s1{background:var(--acc,var(--teal))}.vz .s2{background:#fcca39}.vz .s3{background:#b9bec4}

/* ---------- Scene: desk physics, wallpaper, zoom ---------- */

var desk={x:0,y:0,vx:0,vy:0,rx:3,ry:-13,lift:0,drag:false};
var gm={x:-1,y:-1,have:false};
function deskScale(){return Math.min(340,window.innerWidth*.62,window.innerHeight*.5*(PCW/PCH))/PCW}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

var lastDeskKey='';
function applyDesk(){
  var s0=deskScale();
  var key=[desk.x.toFixed(1),desk.y.toFixed(1),desk.rx.toFixed(2),desk.ry.toFixed(2),desk.lift.toFixed(3),s0.toFixed(4)].join();
  if(key===lastDeskKey)return;lastDeskKey=key;
  pc.style.setProperty('--s0',s0);
  pc.style.setProperty('--sc',s0*(1+.05*desk.lift));
  pc.style.setProperty('--tx',desk.x+'px');pc.style.setProperty('--ty',desk.y+'px');
  pc.style.setProperty('--rx',desk.rx+'deg');pc.style.setProperty('--ry',desk.ry+'deg');
  pc.style.setProperty('--lift',desk.lift);
}
function layout(){
  var flow=PHONE()&&inside;
  document.body.classList.toggle('flow',flow);
  if(flow){pc.style.transform='';pc.classList.remove('full');document.body.classList.remove('full');return}
  if(inside&&!PHONE()&&!pc.classList.contains('zooming')&&!pc.classList.contains('full')){pc.classList.add('full');document.body.classList.add('full')}
  if(inside){
    var k=Math.min(window.innerWidth/SCW,window.innerHeight/SCH);
    pc.style.setProperty('--s0',deskScale());
    pc.style.transform='perspective(1900px) rotateY(0deg) rotateX(0deg) translate(0px,'+(-SY*k)+'px) scale('+k+')';
  }else{pc.style.transform='';applyDesk()}
}
function deskStep(){
  if(inside||busy)return;
  var vw=window.innerWidth,vh=window.innerHeight,lim={x:vw/2-80,y:vh/2-80};
  if(!desk.drag&&!RM){
    desk.x+=desk.vx;desk.y+=desk.vy;desk.vx*=.91;desk.vy*=.91;
    if(Math.abs(desk.x)>lim.x){desk.x=clamp(desk.x,-lim.x,lim.x);desk.vx*=-.45}
    if(Math.abs(desk.y)>lim.y){desk.y=clamp(desk.y,-lim.y,lim.y);desk.vy*=-.45}
    if(Math.abs(desk.vx)<.02)desk.vx=0;if(Math.abs(desk.vy)<.02)desk.vy=0;
  }
  var tyaw=-13,tpitch=3;
  if(desk.drag&&!RM){tyaw+=clamp(desk.vx*1.4,-24,24);tpitch-=clamp(desk.vy*.9,-14,14)}
  else if(gm.have&&!RM){tyaw+=clamp((gm.x-(vw/2+desk.x))/(vw/2),-1,1)*15;tpitch-=clamp((gm.y-(vh/2+desk.y))/(vh/2),-1,1)*8}
  var f=RM?1:.1;
  desk.ry+=(tyaw-desk.ry)*f;desk.rx+=(tpitch-desk.rx)*f;
  desk.lift+=((desk.drag?1:0)-desk.lift)*.16;
  applyDesk();

/* pick it up and throw it */
var dragS=null,suppress=false;

});

  if(!dragS||e.pointerId!==dragS.id)return;
  if(!e.buttons){endDrag();return}
  var dx=e.clientX-dragS.sx,dy=e.clientY-dragS.sy;
  if(!dragS.moved&&Math.hypot(dx,dy)>6){dragS.moved=true;desk.drag=true;pc.classList.add('grabbing');try{pc.setPointerCapture(e.pointerId)}catch(x){}}

    var vw=window.innerWidth,vh=window.innerHeight;
    var nx=clamp(dragS.ox+dx,-(vw/2-80),vw/2-80),ny=clamp(dragS.oy+dy,-(vh/2-80),vh/2-80);
    var now=performance.now(),dt=Math.max(8,now-dragS.lt);

  }

/* go in */
function settle(){
  pc.classList.remove('zooming');

  pc.removeEventListener('transitionend',onEnd);
}
function onEnd(e){if(e.target===pc&&e.propertyName==='transform')settle()}

  if(on){screen.removeAttribute('role');screen.removeAttribute('tabindex');screen.removeAttribute('aria-label')}
  else{screen.setAttribute('role','button');screen.tabIndex=0;screen.setAttribute('aria-label','Click to go in to the question gallery')}

}
function goIn(){
  if(inside||busy||suppress)return;inside=true;
  if(!loadW&&!galleryW){if(STATE.loaded)openGallery(null);else openLoad()}
  if(PHONE()){pc.classList.add('in');layout();setInteractive(true);backBtn.classList.add('on');window.scrollTo(0,0);focusFirst();return}
  if(RM){pc.classList.add('in');layout();setInteractive(true);settle();backBtn.classList.add('on');focusFirst();return}
  busy=true;
  pc.classList.add('in','zooming');
  pc.addEventListener('transitionend',onEnd);

    }

function openQ(i,src){
  var ex=wins.filter(function(w){return w.kind==='q'&&w.idx===i})[0];
  if(ex){raise(ex.el);return}
  if(PHONE())wins.slice().forEach(function(w){if(w.kind==='q')closeW(w,true)});
  var qs=wins.filter(function(w){return w.kind==='q'});
  if(qs.length>=5)closeW(qs[0],true);
  var n=wins.filter(function(w){return w.kind==='q'}).length;
  var w=newWin({kind:'q',title:'Harmonya',label:'Question',l:13+n*2.6,t:5+n*2.4,w:72,h:62,from:src});
  fill(w,i);
  return w;
}

function bookCall(w,email,cta){
  var btn=cta.querySelector('.go');
  if(btn.disabled||w.booking)return;
  w.booking=true;
  var p={type:'meeting',email:email,brand:STATE.brand,category:STATE.catText,question:Q[w.idx].q,opened:Object.keys(STATE.opened).map(function(k){return Q[k].q.slice(0,60)})};
  var configured=leadConfigured(),b=STATE.brand||'your brand';
  btn.disabled=true;
  if(MEETING_URL&&!w.openedLink){
    w.openedLink=true;
    var a=document.createElement('a');a.href=MEETING_URL+(MEETING_URL.indexOf('?')<0?'?':'&')+'email='+encodeURIComponent(email);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
  }
  submitLead(p).then(function(r){
    w.booking=false;
    if(configured&&!r.sent){
      btn.disabled=false;var m=cta.querySelector('.err2');
      if(!m){m=document.createElement('p');m.className='note err2';m.setAttribute('role','alert');cta.appendChild(m)}
      m.textContent='That did not go through. Try again.';return;
    }
    if(MEETING_URL){cta.innerHTML=configured?'<p class="done">Thanks. We\u2019ll come to the call ready for '+esc(b)+'.</p>':'<p class="done">The booking page is open in a new tab. Pick a time that works for you.</p>';return}
    if(configured){cta.innerHTML='<p class="done">Got it. We\u2019ll email you to find a time.</p>';return}
    cta.innerHTML='<p class="note">Preview only: the booking link is not set, so nothing opened and nothing was sent.</p>';
  });
}

/* typing */
function finish(w){
  var f=w.body.querySelector('.field');if(!f)return;f.classList.add('done');
  var t=f.querySelector('.txt');t.classList.remove('cur');t.textContent=tpl(Q[w.idx].ask);
  w.body.querySelector('.reveal').classList.add('on');
}
function skipTyping(w){if(!w.body.querySelector('.reveal.on')){w.run=(w.run||0)+1;finish(w)}}
function play(w){
  var id=w.run=(w.run||0)+1;
  if(RM){finish(w);return}
  var f=w.body.querySelector('.field'),el=f.querySelector('.txt'),text=tpl(Q[w.idx].ask),c=0;
  function step(){
    if(id!==w.run||!w.el.isConnected)return;
    if(c<=text.length){el.textContent=text.slice(0,c++);setTimeout(step,10)}
    else{f.classList.add('done');el.classList.remove('cur');w.body.querySelector('.reveal').classList.add('on')}
  }
  setTimeout(step,300);
}

/* ---------- Desktop icons ---------- */
function renderIcons(){
  iconsEl.innerHTML='';
  var disk='<svg viewBox="0 0 120 124" aria-hidden="true"><path d="M6 4H100L116 20V118a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V8a4 4 0 0 1 4-4z" fill="#3a56b0"/><rect x="30" y="4" width="54" height="34" fill="#c9ccd1"/><rect x="62" y="9" width="14" height="24" fill="#2a2d33"/><rect x="14" y="56" width="92" height="60" fill="#fff"/><rect x="14" y="56" width="92" height="6" fill="#fcca39"/></svg>';
  var tile='<svg viewBox="0 0 120 124" aria-hidden="true"><rect x="6" y="14" width="108" height="96" fill="#fff"/><rect x="6" y="14" width="108" height="96" fill="none" stroke="#9aa0a6" stroke-width="3"/><text x="60" y="88" text-anchor="middle" font-family="Bungee,Impact,sans-serif" font-size="70" fill="#009ea6" stroke="#0c3b3f" stroke-width="2" paint-order="stroke">H</text></svg>';
  [['Disk',disk,function(){if(loadW)raise(loadW.el);else openLoad();setInteractive(true)}],['Questions',tile,function(){if(!STATE.loaded){openLoad();return}if(galleryW)raise(galleryW.el);else openGallery(null);setInteractive(true)}]].forEach(function(d){
    var b=document.createElement('button');b.type='button';b.className='icon';b.innerHTML=d[1]+'<span>'+d[0]+'</span>';b.addEventListener('click',function(e){e.stopPropagation();if(inside)d[2]()});iconsEl.appendChild(b);
  });
}



/* ---------- Cursor: a soft arrow that trails your pointer on the desk ---------- */
var fine=window.matchMedia('(hover:hover) and (pointer:fine)').matches;
var pcur=document.createElement('div');pcur.className='pcursor';pcur.setAttribute('aria-hidden','true');
pcur.innerHTML='<svg viewBox="0 0 22 26" width="22" height="26"><path d="M2.5 2.5 L2.5 20.5 L7.2 16.2 L10.6 23.6 L13.6 22.2 L10.3 14.9 L16.8 14.4 Z" fill="#14181b" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
document.body.appendChild(pcur);
var cp={x:-60,y:-60,tx:-60,ty:-60,on:false};
window.addEventListener('pointermove',function(e){cp.tx=e.clientX;cp.ty=e.clientY;if(cp.x<-50){cp.x=cp.tx;cp.y=cp.ty}cp.on=fine&&e.pointerType==='mouse'});
window.addEventListener('pointerdown',function(){pcur.classList.add('down')});
window.addEventListener('pointerup',function(){pcur.classList.remove('down')});
document.addEventListener('mouseleave',function(){cp.on=false});
function cursorStep(){
  if(!fine)return;
  var dx=cp.tx-cp.x,dy=cp.ty-cp.y,f=RM?1:.24;
  cp.x+=dx*f;cp.y+=dy*f;
  var sp=Math.hypot(dx,dy),show=cp.on&&!inside;
  pcur.style.transform='translate('+cp.x.toFixed(1)+'px,'+cp.y.toFixed(1)+'px)';
  pcur.style.opacity=show?1:0;
  pcur.style.filter=(!RM&&sp>5)?'blur('+Math.min(2.4,sp*.04).toFixed(2)+'px)':'none';
  document.body.classList.toggle('nocursor',show);
}

/* ---------- Keys ---------- */
document.addEventListener('keydown',function(e){
  if(!inside)return;
  if(e.key==='Escape'){
    e.preventDefault();
    if(helpEl)return closeHelp();
    var top=null;
    wins.forEach(function(w){if(w.kind!=='q')return;if(!top||(+w.el.style.zIndex||0)>(+top.el.style.zIndex||0))top=w});
    if(top){closeW(top);return}
    if(galleryW){closeW(galleryW);return}
    goOut();
  }
});

/* ---------- Start ---------- */
(function(){
  var h='';try{h=decodeURIComponent((location.hash||'').slice(1)).slice(0,80)}catch(e){}
  if(!h)return;
  function words(x){return x.replace(/[-_]+/g,' ').trim()}
  function title(x){return words(x).replace(/\b([a-z])/g,function(m){return m.toUpperCase()})}
  var parts=h.split('.'),bw=words(parts[0]);
  if(!/^[A-Za-z0-9 ]+$/.test(bw))return;
  STATE.brand=title(parts[0]).slice(0,40);
  var cw=parts[1]?words(parts[1]):'';
  if(cw&&/^[A-Za-z0-9 &]+$/.test(cw))STATE.catText=(cw.charAt(0).toUpperCase()+cw.slice(1)).slice(0,40);
})();
openLoad();renderIcons();setInteractive(false);layout();
requestAnimationFrame(frame);
})();
</script>
